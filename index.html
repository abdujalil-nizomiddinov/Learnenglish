const BD={h:'Qiyin',k:'Biladi',n:'Yangi',x:'O‘rganilmoqda'};

let mode='all',cur=null,recent=[],busy=false,peek=false,tm;
const pool=()=>W.filter(w=>mode==='all'||(mode==='hard'?w.d>0:known(w)));
const wt=w=>mode==='known'?1:w.d>0?1+w.d*1.6:known(w)?.25:w.n?1:2.2;
function pick(){const p=pool();if(!p.length)return null;let c=p;
 if(p.length>1){const ex=recent.slice(-Math.min(4,p.length-1));c=p.filter(w=>!ex.includes(w.i))}
 let sum=0;for(const w of c)sum+=wt(w);let r=Math.random()*sum;
 for(const w of c){r-=wt(w);if(r<=0)return w}return c[c.length-1]}
function grade(w,ok,pk){w.n++;w.t=Date.now();const L=S.log[day()]||(S.log[day()]={ok:0,bad:0});
 if(!ok){w.bad++;w.s=0;w.d=Math.min(10,w.d+2);L.bad++}
 else if(!pk){w.ok++;w.s++;if(w.d>0)w.d--;L.ok++}
 save()}
function streak(){let c=0,o=0;const t=S.log[day()];if(!t||t.ok+t.bad===0)o=1;for(;;o++){const l=S.log[day(o)];if(l&&l.ok+l.bad>0)c++;else break}return c}
function tp(){$('#cs').textContent=streak();const l=S.log[day()];$('#ct').textContent=l?l.ok+l.bad:0}
function segs(){let h=0,k=0;for(const w of W){if(w.d>0)h++;else if(w.s>=5)k++}$('#c-all').textContent=W.length;$('#c-hard').textContent=h;$('#c-known').textContent=k}

function show(w){cur=w;peek=false;busy=false;const c=$('#card'),en=$('#en'),u=$('#uz');
 c.className='card';u.className='uz';u.innerHTML='';$('#bShow').classList.remove('dis');
 if(!w){en.className='en empty';en.textContent=mode==='all'?'So‘z yo‘q. “So‘zlar” bo‘limidan qo‘shing.':mode==='hard'?'Qiyin so‘zlar yo‘q. Ajoyib!':'Hali yaxshi biladigan so‘z yo‘q.';$('#bdg').textContent='';$('#bdg').className='bdg';$('#meta').innerHTML='';return}
 recent.push(w.i);if(recent.length>8)recent.shift();
 en.className='en'+(w.en.length>14?' long':'');en.textContent=w.en;
 const k=stc(w);$('#bdg').textContent=BD[k];$('#bdg').className='bdg '+k;
 $('#meta').innerHTML=`<span>Ko‘rilgan ${w.n}</span><span>To‘g‘ri ${w.ok}</span><span>Xato ${w.bad}</span>`;
 $('#cw').animate([{opacity:0,transform:'translateY(14px) scale(.98)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'})}
function next(){clearTimeout(tm);show(pick())}
function reveal(k){const u=$('#uz');u.innerHTML=`<div class="m">${esc(cur.uz)}</div>`+(cur.alt?`<div class="a">${esc(cur.alt)}</div>`:'')+(cur.note?`<div class="nt">${esc(cur.note)}</div>`:'');
 u.classList.add('show');$('#card').classList.add(k)}
$('#bShow').onclick=()=>{if(!cur||busy||peek)return;peek=true;reveal('peek');$('#bShow').classList.add('dis')};
function answer(ok){if(!cur||busy)return;busy=true;const pk=peek;grade(cur,ok,pk&&ok);tp();segs();if(pk){next();return}reveal(ok?'ok':'no');tm=setTimeout(next,ok?350:1800)}
$('#bOk').onclick=()=>answer(true);$('#bNo').onclick=()=>answer(false);
$('#cw').onclick=()=>{if(busy)next()};
$('#bSp').onclick=()=>{if(!cur||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur.en);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)};
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));next()};

/* so‘zlar bo‘limi */
let q='',f='all',lim=80,qt;
function rw(){const ql=nm(q.trim());const a=[];
 for(let i=W.length-1;i>=0;i--){const w=W[i];if(f!=='all'&&stc(w)!==f)continue;if(ql&&!nm(w.en+' '+w.uz+' '+w.alt).includes(ql))continue;a.push(w)}
 $('#wc').textContent=W.length+' ta so‘z';
 $('#list').innerHTML=a.length?a.slice(0,lim).map(w=>`<button class="row press" data-i="${w.i}"><div><b>${esc(w.en)}</b><span>${esc(w.uz)}${w.alt?', '+esc(w.alt):''}</span></div><i class="dot s-${stc(w)}"></i></button>`).join('')+(a.length>lim?`<button class="btn press" id="more">Yana ${a.length-lim} ta</button>`:''):'<p class="emp">So‘z topilmadi</p>'}
$('#q').oninput=e=>{q=e.target.value;lim=80;clearTimeout(qt);qt=setTimeout(rw,80)};
$('#fl').onclick=e=>{const b=e.target.closest('button');if(!b)return;f=b.dataset.f;lim=80;document.querySelectorAll('#fl button').forEach(x=>x.classList.toggle('on',x===b));rw()};
$('#list').onclick=e=>{if(e.target.closest('#more')){lim+=150;rw();return}const r=e.target.closest('.row');if(r)form(r.dataset.i)};
$('#fab').onclick=()=>form();

/* oyna (sheet) */
const sh=$('#sheet');
function sheet(h){$('#sp').innerHTML=h;$('#sp').scrollTop=0;sh.classList.add('on')}
function closeSheet(){sh.classList.remove('on');document.activeElement&&document.activeElement.blur()}
$('#sbk').onclick=closeSheet;
if(window.visualViewport){const v=visualViewport,fit=()=>{sh.style.height=v.height+'px';sh.style.top=v.offsetTop+'px'};v.addEventListener('resize',fit);v.addEventListener('scroll',fit)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1700)}
function c2(b,fn,txt='Tasdiqlang'){if(b.dataset.c){delete b.dataset.c;fn();return}const o=b.innerHTML;b.dataset.c=1;b.textContent=txt;setTimeout(()=>{if(b.isConnected&&b.dataset.c){delete b.dataset.c;b.innerHTML=o}},2500)}

function form(id){const w=id?W.find(x=>x.i===id):null,v=w||{en:'',uz:'',alt:'',note:''};
 sheet(`<div class="grab"></div><h2>${w?'Tahrirlash':'Yangi so‘z'}</h2>
<label>Inglizcha<input id="fe" value="${esc(v.en)}" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
<label>O‘zbekcha (asosiy tarjima)<input id="fu" value="${esc(v.uz)}" autocapitalize="none"></label>
<label>Boshqacha aytilishi (vergul bilan)<input id="fa" value="${esc(v.alt)}" autocapitalize="none"></label>
<label>Izoh yoki misol<input id="fn" value="${esc(v.note)}"></label>
<div class="two"><button class="btn gold press" id="fs">Saqlash</button>${w?'<button class="btn no press" id="fd">O‘chirish</button>':'<button class="btn press" id="fb">Ko‘p qo‘shish</button>'}</div>`);
 $('#fs').onclick=()=>{const en=$('#fe').value.trim(),uz=$('#fu').value.trim();
  if(!en||!uz)return toast('Inglizcha va o‘zbekchani yozing');
  if(W.some(x=>x!==w&&nm(x.en)===nm(en)&&nm(x.uz)===nm(uz)))return toast('Bu so‘z allaqachon bor');
  const alt=$('#fa').value.trim(),note=$('#fn').value.trim();
  if(w){Object.assign(w,{en,uz,alt,note});closeSheet();toast('Saqlandi')}
  else{W.push(mk(en,uz,alt,note));toast('Qo‘shildi: '+W.length);['#fe','#fu','#fa','#fn'].forEach(s=>$(s).value='');$('#fe').focus();if(!cur)next()}
  save();rw();segs()};
 if(w)$('#fd').onclick=function(){c2(this,()=>{W.splice(W.indexOf(w),1);if(cur===w)next();closeSheet();save();rw();segs();toast('O‘chirildi')})};
 else $('#fb').onclick=bulk}
function bulk(){sheet(`<div class="grab"></div><h2>Ko‘p so‘z qo‘shish</h2><p class="hint">Har qatorga bitta so‘z: inglizcha = o‘zbekcha, boshqa ma’nolar. Masalan: good = yaxshi, a’lo</p><textarea id="bt" autocapitalize="none" spellcheck="false"></textarea><button class="btn gold press" id="bs" style="margin-top:12px">Qo‘shish</button>`);
 $('#bs').onclick=()=>{let c=0;for(const ln of $('#bt').value.split('\n')){const m=ln.trim().match(/^(.+?)\s*(?:=|:|\t|\s[-–—]\s)\s*(.+)$/);if(!m)continue;
  const en=m[1].trim(),p=m[2].split(','),uz=p.shift().trim(),alt=p.join(',').trim();
  if(!en||!uz||W.some(x=>nm(x.en)===nm(en)&&nm(x.uz)===nm(uz)))continue;W.push(mk(en,uz,alt));c++}
  save();closeSheet();rw();segs();if(!cur)next();toast(c+' ta so‘z qo‘shildi')}}
function backup(){sheet(`<div class="grab"></div><h2>Zaxira nusxa</h2><p class="hint">Matnni nusxalab saqlang. Tiklash uchun uni shu yerga qo‘yib “Tiklash” bosing.</p><textarea id="bk" spellcheck="false"></textarea><div class="two"><button class="btn gold press" id="bc">Nusxalash</button><button class="btn press" id="br">Tiklash</button></div>`);
 const t=$('#bk');t.value=JSON.stringify(S);
 $('#bc').onclick=async()=>{try{await navigator.clipboard.writeText(t.value);toast('Nusxalandi')}catch(e){t.select();toast('Matnni qo‘lda nusxalang')}};
 $('#br').onclick=function(){c2(this,()=>{try{const o=JSON.parse(t.value);if(!Array.isArray(o.w))throw 0;
  S={w:o.w.filter(x=>x&&x.en&&x.uz).map(x=>({...mk(x.en,x.uz),...x})),log:o.log||{},book:1};W=S.w;cur=null;flush();closeSheet();segs();rs();toast('Tiklandi')}catch(e){toast('Matn noto‘g‘ri')}})}}

/* statistika va daraja: o‘zlashtirilgan lug‘at hajmi bo‘yicha (CEFR) */
function est(){let e=0;for(const w of W){if(known(w))e++;else if(w.d===0&&w.n)e+=.4*w.ok/((w.ok+w.bad)||1)}return e}
function rs(){const e=est();let li=0;for(let i=0;i<LV.length;i++)if(e>=LV[i][0])li=i;
 const lo=LV[li][0],nx=LV[li+1],p=nx?Math.min(100,(e-lo)/(nx[0]-lo)*100):100;
 let ok=0,bad=0,H=0,Kn=0,N=0;for(const w of W){ok+=w.ok;bad+=w.bad;if(w.d>0)H++;else if(w.s>=5)Kn++;if(!w.n)N++}
 const acc=ok+bad?Math.round(ok/(ok+bad)*100):0,t=S.log[day()]||{ok:0,bad:0};
 const ds=[];let mx=1;for(let i=6;i>=0;i--){const l=S.log[day(i)]||{ok:0,bad:0};ds.push([l,new Date(Date.now()-i*864e5).getDay()]);mx=Math.max(mx,l.ok+l.bad)}
 const bars=ds.map(([l,g])=>`<div class="bc"><div class="bb"><i style="height:${l.ok/mx*100}%"></i><i class="r" style="height:${l.bad/mx*100}%"></i></div><small>${DN[g]}</small></div>`).join('');
 const hd=W.filter(w=>w.d>0).sort((a,b)=>b.d-a.d||b.bad-a.bad).slice(0,5).map(w=>`<div class="hr"><b>${esc(w.en)}</b><span>${w.bad} marta xato</span></div>`).join('')||'<p class="hint" style="margin:0">Qiyin so‘z yo‘q</p>';
 $('#v-stats').innerHTML=`<header class="top"><h1>Statistika</h1></header>
<div class="lv"><div class="big">${LV[li][1]}</div><div style="flex:1"><p>Taxminiy lug‘at: <b>${Math.round(e)}</b> so‘z</p><div class="bar"><i style="width:${p}%"></i></div><p>${nx?`${nx[1]} gacha yana ${Math.max(1,Math.ceil(nx[0]-e))} so‘z`:'Eng yuqori daraja'}</p></div></div>
<div class="grid"><div class="tile"><b>${W.length}</b><small>Jami so‘z</small></div><div class="tile"><b style="color:var(--ok)">${Kn}</b><small>Yaxshi biladigan</small></div><div class="tile"><b style="color:var(--no)">${H}</b><small>Qiyin</small></div><div class="tile"><b style="color:var(--g1)">${N}</b><small>Yangi</small></div></div>
<div class="pan"><div class="acc"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle cx="40" cy="40" r="34" fill="none" stroke="#ecd49b" stroke-width="8" stroke-linecap="round" stroke-dasharray="${acc*2.136} 214" transform="rotate(-90 40 40)"/><text x="40" y="46" text-anchor="middle" fill="#f4efe6" font-size="20" font-weight="600">${acc}%</text></svg><div><b>Aniqlik</b><p class="hint" style="margin:4px 0 0">Bugun: ${t.ok} to‘g‘ri, ${t.bad} xato<br>Ketma-ket kun: ${streak()}</p></div></div></div>
<div class="pan"><h3>Oxirgi 7 kun</h3><div class="bars">${bars}</div></div>
<div class="pan"><h3>Eng qiyin so‘zlar</h3>${hd}</div>
<p class="hint">Daraja o‘zlashtirilgan so‘zlar soniga qarab hisoblanadi: A1 taxminan 500, A2 1000, B1 2000, B2 4000, C1 8000, C2 16000 so‘z.</p>
<div class="two"><button class="btn press" id="bkw">Murphy so‘zlarini qo‘shish</button></div>
<div class="two"><button class="btn press" id="bkb">Zaxira nusxa</button><button class="btn no press" id="rz">Natijani tozalash</button></div>
<div class="two" style="margin-bottom:8px"><button class="btn no press" id="da">Hamma so‘zni o‘chirish</button></div>`;
 $('#bkb').onclick=backup;
 $('#bkw').onclick=()=>{const c=addBook();save();segs();if(!cur)next();toast(c?c+' ta so‘z qo‘shildi':'Hammasi allaqachon bor')};
 $('#rz').onclick=function(){c2(this,()=>{W.forEach(w=>{w.n=w.ok=w.bad=w.s=w.d=w.t=0});S.log={};save();rs();segs();tp();toast('Natija tozalandi')})};
 $('#da').onclick=function(){c2(this,()=>{W=S.w=[];S.log={};cur=null;save();rs();segs();tp();toast('Hammasi o‘chirildi')})}}

/* tablar */
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 $('#fab').classList.toggle('on',v==='words');
 if(v==='words')rw();if(v==='stats')rs();
 if(v==='home'){segs();tp();if(!cur||!W.includes(cur))next();else if(!busy&&!peek){$('#en').textContent=cur.en}}}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};

/* ekran o‘chib qolmasligi */
let wl;async function wake(){try{if('wakeLock' in navigator&&!document.hidden&&(!wl||wl.released))wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{document.hidden?flush():wake()});
addEventListener('touchend',wake,{passive:true});
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ilova ikonasi */
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);
 g.addColorStop(0,'#f3dda6');g.addColorStop(1,'#a77d36');x.fillStyle='#0a0a0c';x.fillRect(0,0,180,180);x.fillStyle=g;
 x.font='700 100px ui-serif,Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('Aa',90,96);$('#ati').href=c.toDataURL('image/png')})();

segs();tp();next();wake();save();
</script>
</body>
</html>
