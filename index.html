<script>
const $=s=>document.querySelector(s),K='wt1',ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=s=>String(s).toLowerCase().replace(/[‘’ʻʼ`]/g,"'");
const p2=n=>String(n).padStart(2,'0'),day=(o=0)=>{const d=new Date(Date.now()-o*864e5);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mk=(en,uz,alt='',note='')=>({i:uid(),en,uz,alt,note,n:0,ok:0,bad:0,s:0,d:0,t:0,m:0});
const LV=[[0,'Pre-A1'],[500,'A1'],[1000,'A2'],[2000,'B1'],[4000,'B2'],[8000,'C1'],[16000,'C2']],DN=['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const SAMPLE=[['apple','olma'],['book','kitob'],['good','yaxshi','a’lo'],['go','bormoq','ketmoq','went, gone'],['learn','o‘rganmoq'],['remember','eslamoq','yodda saqlamoq'],['friend','do‘st'],['water','suv']];
const LANGS=[['en-US','Inglizcha'],['en-GB','Inglizcha (UK)'],['ru-RU','Ruscha'],['tr-TR','Turkcha'],['de-DE','Nemischa'],['fr-FR','Fransuzcha'],['es-ES','Ispancha'],['it-IT','Italyancha'],['ar-SA','Arabcha'],['ko-KR','Koreyscha'],['ja-JP','Yaponcha'],['zh-CN','Xitoycha']];
const DEF={a:'Inglizcha',b:'O‘zbekcha',lang:'en-US',auto:false,rev:false,sort:'new',goal:20};

let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.w))S={w:[],log:{}};
S.log=S.log||{};S.cfg=Object.assign({},DEF,S.cfg);let W=S.w;
let cleaned=0;if(!S.fx){const n0=W.length;W=S.w=W.filter(w=>!(/^[\[{"\\]/.test(w.en)||/\\"|"\s*:/.test(w.en+w.uz)));cleaned=n0-W.length;S.fx=1}
const idb={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('lugat',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
 async set(v){try{(await this.open()).transaction('kv','readwrite').objectStore('kv').put(v,'S')}catch(e){}},
 async get(){try{const d=await this.open();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get('S');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}};
const hadLS=(()=>{try{return !!localStorage.getItem(K)}catch(e){return false}})();
const flush=()=>{const j=JSON.stringify(S);try{localStorage.setItem(K,j)}catch(e){}idb.set(j)};
let sv;const save=()=>{clearTimeout(sv);sv=setTimeout(flush,250)};
addEventListener('pagehide',flush);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* holat qoidalari: d = qiyinlik (0..10), s = ketma-ket to‘g‘ri javoblar */
const known=w=>w.d===0&&w.s>=5;
const stc=w=>w.d>0?'h':w.s>=5?'k':!w.n?'n':'x';
const BD={h:'Qiyin',k:'Biladi',n:'Yangi',x:'O‘rganilmoqda'};
function fixS(){S.log=S.log||{};S.cfg=Object.assign({},DEF,S.cfg);W=S.w;for(const w of W)if(w.m===undefined)w.m=known(w)?1:0}fixS();
const snap=()=>{try{localStorage.setItem('wt1_snap',JSON.stringify(S))}catch(e){}};
let last=null;

let mode='all',cur=null,recent=[],busy=false,peek=false,tm;
const pool=()=>W.filter(w=>mode==='all'||(mode==='new'?!w.m:mode==='hard'?w.d>0:known(w)));
const wt=w=>mode==='known'?1:mode==='new'?(w.d>0?1+w.d*1.6:w.n?1:2.5):w.d>0?1+w.d*1.6:known(w)?.25:w.n?1:2.2;
function pick(){const p=pool();if(!p.length)return null;let c=p;
 if(p.length>1){const ex=recent.slice(-Math.min(4,p.length-1));c=p.filter(w=>!ex.includes(w.i))}
 let sum=0;for(const w of c)sum+=wt(w);let r=Math.random()*sum;
 for(const w of c){r-=wt(w);if(r<=0)return w}return c[c.length-1]}
function grade(w,ok,pk){const L0=S.log[day()]||{ok:0,bad:0};last={w,day:day(),L:{ok:L0.ok,bad:L0.bad},s:{n:w.n,ok:w.ok,bad:w.bad,s:w.s,d:w.d,t:w.t,m:w.m}};w.n++;w.t=Date.now();const L=S.log[day()]||(S.log[day()]={ok:0,bad:0});
 if(!ok){w.bad++;w.s=0;w.d=Math.min(10,w.d+2);L.bad++}
 else if(!pk){w.ok++;w.s++;if(w.d>0)w.d--;L.ok++}
 if(known(w))w.m=1;
 save()}
function streak(){let c=0,o=0;const t=S.log[day()];if(!t||t.ok+t.bad===0)o=1;for(;;o++){const l=S.log[day(o)];if(l&&l.ok+l.bad>0)c++;else break}return c}
function tp(){$('#cs').textContent=streak();const l=S.log[day()],n=l?l.ok+l.bad:0,g=S.cfg.goal;$('#ct').textContent=g?n+'/'+g:n;if(g&&n===g&&last&&!$('#bUn').hidden)toast('Kunlik maqsad bajarildi!')}
function segs(){let h=0,k=0,nw=0;for(const w of W){if(w.d>0)h++;else if(w.s>=5)k++;if(!w.m)nw++}$('#c-all').textContent=W.length;$('#c-new').textContent=nw;$('#c-hard').textContent=h;$('#c-known').textContent=k}
function say(t){if(!window.speechSynthesis||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.cfg.lang;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function applyCfg(){$('#bShowT').textContent=S.cfg.rev?S.cfg.a:S.cfg.b}

function show(w){cur=w;peek=false;busy=false;const c=$('#card'),en=$('#en'),u=$('#uz'),emp=!W.length;
 $('#v-home').classList.toggle('noW',emp);c.className='card';u.className='uz';u.innerHTML='';$('#bShow').classList.remove('dis');
 $('#cw').style.display=emp?'none':'flex';$('#empty').style.display=emp?'flex':'none';$('#bSp').style.visibility=emp?'hidden':'visible';
 if(!w){en.className='en empty';en.textContent=emp?'':mode==='new'?'Yangi so‘z qolmadi. Barchasi o‘zlashtirilgan!':mode==='hard'?'Qiyin so‘zlar yo‘q. Ajoyib!':mode==='known'?'Hali yaxshi biladigan so‘z yo‘q.':'So‘z topilmadi.';$('#bdg').textContent='';$('#bdg').className='bdg';$('#meta').innerHTML='';return}
 recent.push(w.i);if(recent.length>8)recent.shift();
 const f=S.cfg.rev?w.uz:w.en;
 en.className='en'+(f.length>14?' long':'');en.textContent=f;
 const k=stc(w);$('#bdg').textContent=BD[k];$('#bdg').className='bdg '+k;
 $('#meta').innerHTML=`<span>Ko‘rilgan ${w.n}</span><span>To‘g‘ri ${w.ok}</span><span>Xato ${w.bad}</span>`;
 $('#cw').animate([{opacity:0,transform:'translateY(14px) scale(.98)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});
 if(S.cfg.auto&&!S.cfg.rev)say(w.en)}
function next(){clearTimeout(tm);show(pick())}
function reveal(k){const u=$('#uz'),r=S.cfg.rev;u.innerHTML=`<div class="m">${esc(r?cur.en:cur.uz)}</div>`+(cur.alt?`<div class="a">${esc(cur.alt)}</div>`:'')+(cur.note?`<div class="nt">${esc(cur.note)}</div>`:'');
 u.classList.add('show');$('#card').classList.add(k);if(r&&S.cfg.auto)say(cur.en)}
$('#bShow').onclick=()=>{if(!cur||busy||peek)return;peek=true;reveal('peek');$('#bShow').classList.add('dis')};
function answer(ok){if(!cur||busy)return;busy=true;const pk=peek;grade(cur,ok,pk&&ok);$('#bUn').hidden=false;try{navigator.vibrate&&navigator.vibrate(ok?8:[12,40,12])}catch(e){}tp();segs();if(pk){next();return}reveal(ok?'ok':'no');tm=setTimeout(next,ok?350:1800)}
$('#bOk').onclick=()=>answer(true);$('#bNo').onclick=()=>answer(false);
function undo(){if(!last||!W.includes(last.w))return;clearTimeout(tm);const l=last;Object.assign(l.w,l.s);S.log[l.day]=l.L;last=null;$('#bUn').hidden=true;save();recent=recent.filter(i=>i!==l.w.i);show(l.w);tp();segs();toast('Qaytarildi')}
$('#bUn').onclick=undo;
(()=>{const cw=$('#cw'),card=$('#card');let x0=0,y0=0,dx=0,dy=0,on=false,mv=false;
 card.addEventListener('touchstart',e=>{if(e.target.closest('button')||!cur||e.touches.length>1)return;const t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=dy=0;on=true;mv=false},{passive:true});
 card.addEventListener('touchmove',e=>{if(!on)return;const t=e.touches[0];dx=t.clientX-x0;dy=t.clientY-y0;if(!mv&&Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy))mv=true;if(mv&&!busy){cw.style.transition='none';cw.style.transform='translateX('+dx+'px) rotate('+dx/30+'deg)';card.style.borderColor=dx>0?'rgba(95,211,160,.6)':'rgba(255,122,138,.6)'}},{passive:true});
 card.addEventListener('touchend',()=>{if(!on)return;on=false;cw.style.transition='transform .2s';cw.style.transform='';card.style.borderColor='';if(mv&&!busy&&Math.abs(dx)>80)answer(dx>0)});
 card.addEventListener('click',e=>{if(e.target.closest('button')||!cur)return;if(busy)next();else if(!peek)$('#bShow').click()});
 addEventListener('keydown',e=>{if(sh.classList.contains('on')||!$('#v-home').classList.contains('on')||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;if(e.key==='ArrowRight')answer(true);else if(e.key==='ArrowLeft')answer(false);else if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();$('#bShow').click()}})})();
$('#bSp').onclick=()=>{if(cur)say(cur.en)};
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));next()};

/* so‘zlar bo‘limi */
let q='',f='all',lim=80,qt;const co=new Intl.Collator('en',{sensitivity:'base'});
function rw(){const ql=nm(q.trim()),so=S.cfg.sort;let a=[];
 for(let i=0;i<W.length;i++){const w=W[i];if(f!=='all'&&(f==='n'?w.m:stc(w)!==f))continue;if(ql&&!nm(w.en+' '+w.uz+' '+w.alt).includes(ql))continue;a.push(w)}
 if(so==='new')a.reverse();else if(so==='az')a.sort((x,y)=>co.compare(x.en,y.en));
 $('#wc').textContent=W.length+' ta so‘z';
 document.querySelectorAll('#so button').forEach(b=>b.classList.toggle('on',b.dataset.s===so));
 $('#list').innerHTML=a.length?a.slice(0,lim).map(w=>`<button class="row press" data-i="${w.i}"><div><b>${esc(w.en)}</b><span>${esc(w.uz)}${w.alt?', '+esc(w.alt):''}</span></div><i class="dot s-${stc(w)}"></i></button>`).join('')+(a.length>lim?`<button class="btn press" id="more">Yana ${a.length-lim} ta</button>`:''):W.length?'<p class="emp">So‘z topilmadi</p>':'<p class="emp">Hali so‘z yo‘q.<br>Pastdagi + tugmasini bosing.</p>'}
$('#q').oninput=e=>{q=e.target.value;lim=80;clearTimeout(qt);qt=setTimeout(rw,80)};
$('#fl').onclick=e=>{const b=e.target.closest('button');if(!b)return;f=b.dataset.f;lim=80;document.querySelectorAll('#fl button').forEach(x=>x.classList.toggle('on',x===b));rw()};
$('#so').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.cfg.sort=b.dataset.s;lim=80;save();rw()};
$('#list').onclick=e=>{if(e.target.closest('#more')){lim+=150;rw();return}const r=e.target.closest('.row');if(r)form(r.dataset.i)};
$('#fab').onclick=()=>form();

/* oyna (sheet) va yordamchilar */
const sh=$('#sheet');
function sheet(h){const was=sh.classList.contains('on');$('#sp').innerHTML=h;$('#sp').scrollTop=0;sh.classList.add('on');if(!was){try{history.pushState({s:1},'')}catch(e){}}}
function closeSheet(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');document.activeElement&&document.activeElement.blur();try{if(history.state&&history.state.s)history.back()}catch(e){}}
addEventListener('popstate',()=>{if(sh.classList.contains('on'))sh.classList.remove('on')});
$('#sbk').onclick=closeSheet;
if(window.visualViewport){const v=visualViewport,fit=()=>{sh.style.height=v.height+'px';sh.style.top=v.offsetTop+'px'};v.addEventListener('resize',fit);v.addEventListener('scroll',fit)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.toggle('tp',sh.classList.contains('on'));t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900)}
function c2(b,fn,txt='Tasdiqlang'){if(b.dataset.c){delete b.dataset.c;fn();return}const o=b.innerHTML;b.dataset.c=1;b.textContent=txt;setTimeout(()=>{if(b.isConnected&&b.dataset.c){delete b.dataset.c;b.innerHTML=o}},2500)}
function refresh(){segs();tp();if($('#v-words').classList.contains('on'))rw();if($('#v-stats').classList.contains('on'))rs();if(!cur||!W.includes(cur))next()}
function act(n){({add:()=>form(),bulk:bulk,guide:guide,sample:()=>{const c=addMany(SAMPLE.map(a=>({en:a[0],uz:a[1],alt:a[2]||'',note:a[3]||''})));closeSheet();toast(c+' ta namuna so‘z qo‘shildi')}}[n]||(()=>{}))()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act)});
function addMany(items){const have=new Set(W.map(w=>nm(w.en)+'|'+nm(w.uz)));let c=0;for(const it of items){const k=nm(it.en)+'|'+nm(it.uz);if(have.has(k))continue;have.add(k);W.push(mk(it.en,it.uz,it.alt||'',it.note||''));c++}save();refresh();return c}

/* bitta so‘z qo‘shish / tahrirlash */
function form(id){const w=id?W.find(x=>x.i===id):null,v=w||{en:'',uz:'',alt:'',note:''},c=S.cfg;
 sheet(`<div class="grab"></div><h2>${w?'Tahrirlash':'Yangi so‘z'}</h2>
<label>${esc(c.a)}<input id="fe" value="${esc(v.en)}" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
<label>${esc(c.b)} (asosiy tarjima)<input id="fu" value="${esc(v.uz)}" autocapitalize="none"></label>
<label>Boshqa ma’nolari (ixtiyoriy, vergul bilan)<input id="fa" value="${esc(v.alt)}" autocapitalize="none"></label>
<label>Izoh yoki misol (ixtiyoriy)<input id="fn" value="${esc(v.note)}"></label>
<div class="two"><button class="btn gold press" id="fs">Saqlash</button>${w?'<button class="btn no press" id="fd">O‘chirish</button>':'<button class="btn press" id="fb">Ko‘p qo‘shish</button>'}</div>`);
 $('#fs').onclick=()=>{const en=$('#fe').value.trim(),uz=$('#fu').value.trim();
  if(!en||!uz)return toast('So‘z va tarjimani yozing');
  if(W.some(x=>x!==w&&nm(x.en)===nm(en)&&nm(x.uz)===nm(uz)))return toast('Bu so‘z allaqachon bor');
  const alt=$('#fa').value.trim(),note=$('#fn').value.trim();
  if(w){Object.assign(w,{en,uz,alt,note});toast('Saqlandi')}else{W.push(mk(en,uz,alt,note));toast('Qo‘shildi')}
  closeSheet();save();refresh()};
 if(w)$('#fd').onclick=function(){c2(this,()=>{W.splice(W.indexOf(w),1);if(cur===w)next();closeSheet();save();refresh();toast('O‘chirildi')})};
 else $('#fb').onclick=bulk}

/* ko‘p so‘z qo‘shish */
function parseBulk(t){const tt=t.trim();if(/^[\[{]/.test(tt)&&/"(w|en)"\s*:/.test(tt))return{json:true,items:[],bad:0,dup:0};const items=[],have=new Set(W.map(w=>nm(w.en)+'|'+nm(w.uz)));let bad=0,dup=0;
 for(let ln of t.split(/\r?\n/)){ln=ln.trim();if(!ln||ln[0]==='#')continue;let en='',uz='',alt='',note='';
  if(ln.includes('\t')){const c=ln.split('\t').map(x=>x.trim());en=c[0];uz=c[1]||'';alt=c[2]||'';note=c[3]||''}
  else{const m=ln.match(/^(.+?)\s*(?:=|:|\s[-–—]\s)\s*(.+)$/);if(!m){bad++;continue}en=m[1].trim();let r=m[2];const pi=r.indexOf('|');if(pi>=0){note=r.slice(pi+1).trim();r=r.slice(0,pi)}const p=r.split(/[,;]/).map(x=>x.trim()).filter(Boolean);uz=p.shift()||'';alt=p.join(', ')}
  if(!en||!uz){bad++;continue}
  const k=nm(en)+'|'+nm(uz);if(have.has(k)){dup++;continue}have.add(k);items.push({en,uz,alt,note})}
 return{items,bad,dup}}
const EX='good = yaxshi, a’lo\ngo = bormoq | went, gone\nbook = kitob\nfine = jarima';
function bulk(){sheet(`<div class="grab"></div><h2>Ko‘p so‘z qo‘shish</h2><p class="hint">Har qatorga bitta so‘z: <b>so‘z = tarjima, boshqa ma’no | izoh</b></p>
<textarea id="bt" placeholder="${esc(EX)}" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
<div class="two" style="margin-top:8px"><button class="btn sm press" id="bx">Misol</button><button class="btn sm press" id="bp">Joylash</button><button class="btn sm press" id="bfl">Fayldan</button></div>
<input type="file" id="bfi" accept=".txt,.csv,.tsv,text/plain" hidden>
<p class="hint" id="pv" style="margin:12px 0">Matn kiriting yoki joylang</p>
<button class="btn gold press" id="bs" disabled style="opacity:.5">Qo‘shish</button>
<div style="text-align:center;margin-top:6px"><button class="lnk" data-act="guide">Qo‘llanma va misollar</button></div>`);
 const t=$('#bt');let pt;
 const upd=()=>{const r=parseBulk(t.value),n=r.items.length;if(r.json){$('#pv').innerHTML='<span style="color:var(--no)">Bu zaxira matni, so‘zlar ro‘yxati emas.</span>';$('#bs').disabled=false;$('#bs').style.opacity=1;$('#bs').textContent='Zaxira sifatida tiklash';return}$('#pv').innerHTML=t.value.trim()?`<b style="color:var(--ok)">${n} ta yangi</b>${r.dup?`, ${r.dup} ta takror`:''}${r.bad?`, <span style="color:var(--no)">${r.bad} ta qator o‘qilmadi</span>`:''}`:'Matn kiriting yoki joylang';$('#bs').disabled=!n;$('#bs').style.opacity=n?1:.5;$('#bs').textContent=n?`${n} ta so‘zni qo‘shish`:'Qo‘shish'};
 t.oninput=()=>{clearTimeout(pt);pt=setTimeout(upd,120)};
 $('#bx').onclick=()=>{t.value=EX;upd()};
 $('#bp').onclick=async()=>{try{t.value=(t.value?t.value+'\n':'')+await navigator.clipboard.readText();upd()}catch(e){toast('Matnni maydonga qo‘lda joylang')}};
 $('#bfl').onclick=()=>$('#bfi').click();
 $('#bfi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{t.value=(t.value?t.value+'\n':'')+r.result;upd()};r.readAsText(f)};
 $('#bs').onclick=()=>{const r=parseBulk(t.value);if(r.json){askRestore(t.value);return}if(!r.items.length)return;const c=addMany(r.items);closeSheet();toast(c+' ta so‘z qo‘shildi')}}

/* qo‘llanma */
function guide(){S.seen=1;save();sheet(`<div class="grab"></div><h2>Qo‘llanma</h2>
<details open><summary>Bu ilova nima uchun?</summary><div class="dc"><p>Chet tili so‘zlarini yodlash uchun. O‘zingiz so‘z kiritasiz, ilova ularni qayta-qayta so‘raydi. Qiyin so‘zlar ko‘proq, yaxshi bilganlaringiz kamroq chiqadi, shuning uchun vaqt kerakli so‘zlarga ketadi.</p><p>Internet shart emas, ma’lumot telefoningizda saqlanadi.</p></div></details>
<details><summary>Qanday ishlaydi?</summary><div class="dc"><ol>
<li><b>So‘zlar</b> bo‘limida so‘z qo‘shing (pastdagi + tugma yoki “Ko‘p qo‘shish”).</li>
<li><b>Mashq</b>da so‘z chiqadi. Tarjimasini o‘ylang. Bilsangiz “Bilaman”, bilmasangiz “Bilmayman” bosing. Tarjimani oldin ko‘rish uchun kartaga yoki ko‘z tugmasiga bosing (bunda “Bilaman” hisobga olinmaydi). Kartani o‘ngga surib “Bilaman”, chapga surib “Bilmayman” deyish ham mumkin. Adashib bossangiz, qaytarish tugmasi bor.</li>
<li>Xato qilgan so‘z <b>Qiyin</b> bo‘limga tushadi va tez-tez chiqadi. To‘g‘ri javob berganingiz sari asta chiqib ketadi.</li>
<li>Ketma-ket 5 marta to‘g‘ri bilsangiz so‘z <b>Biladigan</b> bo‘limga o‘tadi va kam chiqadi. Xato qilsangiz yana Qiyinga qaytadi.</li>
<li><b>Yangi</b> bo‘limda hali o‘zlashtirilmagan so‘zlar turadi. So‘z <b>Biladigan</b> bo‘limga o‘tgach, Yangi’dan chiqadi.</li>
<li><b>Statistika</b>da aniqlik, 7 kunlik grafik va taxminiy daraja (A1–C2) ko‘rinadi. Daraja o‘zlashtirgan so‘zlaringiz soniga qarab hisoblanadi.</li></ol></div></details>
<details><summary>Ko‘p so‘z qo‘shish</summary><div class="dc"><p>“Ko‘p qo‘shish” oynasiga har qatorga bitta so‘z yozing:</p>
<pre class="ex">apple = olma\ngood = yaxshi, a’lo\ngo = bormoq | went, gone</pre>
<p><b>=</b> o‘rniga <b>:</b> yoki <b> - </b> ham bo‘ladi. Vergul bilan boshqa ma’nolar, <b>|</b> dan keyin izoh yoziladi. Takror so‘zlar o‘zi o‘tkazib yuboriladi, pastda nechta so‘z qo‘shilishi ko‘rinib turadi.</p>
<p><b>Excel / Google Sheets:</b> 2–4 ustunni (so‘z, tarjima, boshqa ma’no, izoh) belgilab nusxalang va joylang. Yoki .txt/.csv faylni “Fayldan” tugmasi bilan oching.</p>
<p><b>Tez yo‘l:</b> sun’iy intellektdan so‘rang: “Menga shu mavzuda 30 ta so‘zni <i>so‘z = o‘zbekcha tarjima</i> formatida ber”, natijani nusxalab joylang.</p></div></details>
<details><summary>Offlayn ishlash</summary><div class="dc"><p>Ilovani internet bilan <b>bir marta</b> oching va Bosh ekranga qo‘shing (Safari: Ulashish → “Bosh ekranga qo‘shish”, Android Chrome: menyu → “Ilovani o‘rnatish”). Shundan keyin u internetsiz ham to‘liq ishlaydi.</p><p>So‘zlar va natijalar telefon xotirasida saqlanadi, internet kerak emas. Yangilanish bo‘lsa, ilova ochilganda o‘zi yuklab oladi.</p></div></details>
<details><summary>Zaxira va boshqa telefon</summary><div class="dc"><p>Ma’lumot faqat shu qurilmada saqlanadi. <b>Statistika → Zaxira</b> orqali faylga saqlang va vaqti-vaqti bilan yangilab turing. Brauzer xotirasi tozalansa, zaxirasiz ma’lumot yo‘qolishi mumkin.</p><p>Boshqa telefonga o‘tish uchun o‘sha faylni yangi qurilmada “Fayldan tiklash” bilan oching. Do‘stingizga so‘z ro‘yxatini yubormoqchi bo‘lsangiz, “So‘z ro‘yxati” matnini nusxalab yuboring, u “Ko‘p qo‘shish”ga joylanadi.</p></div></details>
<details><summary>Sozlamalar va maslahatlar</summary><div class="dc"><p>Sozlamalarda til nomlarini va o‘qish tilini o‘zgartirsangiz, istalgan til jufti uchun ishlatish mumkin. “Teskari rejim”da tarjimadan so‘zni topasiz.</p><p>Har kuni 10–15 daqiqa mashq qiling. Ilovani to‘liq ekranda ochish uchun Safari’da Ulashish → “Bosh ekranga qo‘shish”ni bosing.</p></div></details>
<button class="btn gold press" id="gk" style="margin-top:6px">Boshlash</button>${W.length?'':'<div style="text-align:center;margin-top:6px"><button class="lnk" data-act="sample">Avval namuna so‘zlar bilan sinab ko‘rish</button></div>'}`);$('#gk').onclick=closeSheet}

/* sozlamalar */
function settings(){const c=S.cfg;
 const rdy=offReady(),ins=standalone(),ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
 sheet(`<div class="grab"></div><h2>Sozlamalar</h2>
<div class="pan" style="margin-bottom:14px"><div class="hr" style="border:0;padding-top:0"><span style="color:var(--tx)">Offlayn rejim</span><span style="color:${rdy?'var(--ok)':'var(--mu)'}">${rdy?'Tayyor':'Tayyor emas'}</span></div>
<div class="hr"><span style="color:var(--tx)">Ilova sifatida</span><span style="color:${ins?'var(--ok)':'var(--mu)'}">${ins?'O‘rnatilgan':'O‘rnatilmagan'}</span></div>
${rdy?'':'<p class="hint" style="margin:8px 0 0">Saytni internet bilan bir marta oching, shundan keyin internetsiz ishlaydi.</p>'}
${!ins&&dip?'<button class="btn sm gold press" id="ib" style="margin-top:10px">Ilovani o‘rnatish</button>':''}${!ins&&!dip&&ios?'<p class="hint" style="margin:8px 0 0">Safari: Ulashish tugmasi → “Bosh ekranga qo‘shish”.</p>':''}
<p class="hint" style="margin:8px 0 0;font-size:12px">Versiya ${VER}</p></div>
<label>So‘z tili nomi<input id="sa" value="${esc(c.a)}"></label>
<label>Tarjima tili nomi<input id="sb" value="${esc(c.b)}"></label>
<label>O‘qish (talaffuz) tili<select id="sl">${LANGS.map(([v,n])=>`<option value="${v}"${v===c.lang?' selected':''}>${n}</option>`).join('')}</select></label>
<div class="tg" id="t1" style="margin-top:12px"><span>So‘zni avtomatik o‘qish</span><i class="sw${c.auto?' on':''}"></i></div>
<div class="tg" id="t2"><span>Teskari rejim (tarjimadan so‘z)</span><i class="sw${c.rev?' on':''}"></i></div>
<label>Kunlik maqsad (javoblar soni)<select id="sg">${[0,10,20,30,50,100].map(v=>`<option value="${v}"${v===c.goal?' selected':''}>${v?v+' ta':'O‘chirilgan'}</option>`).join('')}</select></label>
<div class="two"><button class="btn press" id="rz">Natijani tozalash</button><button class="btn no press" id="da">Hammasini o‘chirish</button></div>
${localStorage.getItem('wt1_snap')?'<button class="btn sm press" id="sn" style="margin-top:10px">Oxirgi o‘chirishni qaytarish</button>':''}`);
 const set=(k,v)=>{S.cfg[k]=v;save();applyCfg()};
 $('#sg').onchange=e=>{set('goal',+e.target.value);tp()};
 const sn=$('#sn');if(sn)sn.onclick=function(){c2(this,()=>{try{const o=JSON.parse(localStorage.getItem('wt1_snap'));if(!o||!Array.isArray(o.w))throw 0;S=o;W=S.w;cur=null;last=null;fixS();flush();closeSheet();applyCfg();sortUI();refresh();toast('Qaytarildi')}catch(e){toast('Qaytarib bo‘lmadi')}})};
 const ib=$('#ib');if(ib)ib.onclick=async()=>{try{dip.prompt();await dip.userChoice}catch(e){}dip=null;closeSheet()};
 $('#sa').oninput=e=>set('a',e.target.value.trim()||DEF.a);$('#sb').oninput=e=>set('b',e.target.value.trim()||DEF.b);
 $('#sl').onchange=e=>set('lang',e.target.value);
 $('#t1').onclick=function(){const o=!S.cfg.auto;set('auto',o);this.querySelector('.sw').classList.toggle('on',o)};
 $('#t2').onclick=function(){const o=!S.cfg.rev;set('rev',o);this.querySelector('.sw').classList.toggle('on',o);next()};
 $('#rz').onclick=function(){c2(this,()=>{snap();W.forEach(w=>{w.n=w.ok=w.bad=w.s=w.d=w.t=0});S.log={};save();closeSheet();refresh();toast('Natija tozalandi')})};
 $('#da').onclick=function(){c2(this,()=>{snap();W=S.w=[];S.log={};cur=null;save();closeSheet();refresh();toast('Hammasi o‘chirildi')})}}

/* zaxira */
const stamp=()=>{S.lastBackup=Date.now();save()};
const dAgo=()=>S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
function listText(){return W.map(w=>w.en+' = '+[w.uz,...(w.alt?w.alt.split(/\s*[,;]\s*/):[])].join(', ')+(w.note?' | '+w.note:'')).join('\n')}
function restore(text,merge){const o=JSON.parse(text);if(!o||!Array.isArray(o.w))throw 0;
 const cl=o.w.filter(x=>x&&x.en&&x.uz).map(x=>{const w={...mk(x.en,x.uz),...x};if(x.m===undefined)w.m=known(w)?1:0;return w});
 if(merge){const have=new Set(W.map(w=>nm(w.en)+'|'+nm(w.uz)));let c=0;for(const w of cl){const k=nm(w.en)+'|'+nm(w.uz);if(!have.has(k)){have.add(k);W.push(w);c++}}for(const[d,l]of Object.entries(o.log||{}))if(!S.log[d])S.log[d]=l;return c}
 snap();S={w:cl,log:o.log||{},cfg:Object.assign({},DEF,o.cfg),lastBackup:S.lastBackup,seen:1,fx:1};W=S.w;cur=null;fixS();return cl.length}
async function saveFile(){const txt=JSON.stringify(S),name=`lugat-zaxira-${day()}.json`;
 try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});stamp();toast('Zaxira saqlandi');if($('#v-stats').classList.contains('on'))rs();return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);stamp();toast('Fayl yuklab olindi')}
async function copyText(s){try{await navigator.clipboard.writeText(s);return true}catch(e){try{const t=document.createElement('textarea');t.value=s;t.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(t);t.select();t.setSelectionRange(0,s.length);const ok=document.execCommand('copy');t.remove();if(ok)return true}catch(e2){}toast('Nusxalab bo‘lmadi');return false}}
function askRestore(text){let o;try{o=JSON.parse(text);if(!o||!Array.isArray(o.w))throw 0}catch(e){return toast('Bu zaxira matni emas')}
 const n=o.w.filter(x=>x&&x.en&&x.uz).length;
 sheet(`<div class="grab"></div><h2>Tiklash</h2><p class="hint" style="font-size:16px">Zaxirada <b style="color:var(--tx)">${n} ta so‘z</b> bor.</p>
<button class="btn gold press" id="rm">Qo‘shib tiklash</button><p class="hint" style="margin:8px 4px 18px">Hozirgi so‘zlar saqlanadi, yangilari qo‘shiladi.</p>
<button class="btn no press" id="rr">Hammasini almashtirish</button><p class="hint" style="margin:8px 4px 0">Hozirgi so‘zlar va natijalar o‘chadi, zaxiradagilar qoladi.</p>`);
 $('#rm').onclick=()=>{const c=restore(text,true);save();closeSheet();refresh();toast(c+' ta yangi so‘z qo‘shildi')};
 $('#rr').onclick=function(){c2(this,()=>{const c=restore(text,false);flush();closeSheet();applyCfg();sortUI();refresh();toast(c+' ta so‘z tiklandi')})}}
function backup(){const d=dAgo();
 sheet(`<div class="grab"></div><h2>Zaxira</h2><p class="hint">${d===null?'Hali zaxira olinmagan':'Oxirgi zaxira: '+(d===0?'bugun':d+' kun oldin')}</p>
<button class="btn gold press" id="bf">${ic('down')}Faylga saqlash</button>
<button class="btn press" id="bl" style="margin-top:10px">${ic('up')}Fayldan tiklash</button>
<input type="file" id="bfi" accept=".json,.txt,application/json" hidden>
<details style="margin-top:18px"><summary>Matn orqali</summary><div class="dc">
<textarea id="bk" placeholder="Zaxira matnini shu yerga joylang" spellcheck="false" style="height:100px"></textarea>
<div class="two"><button class="btn sm press" id="bt">Tiklash</button><button class="btn sm press" id="bc">Zaxirani nusxalash</button></div>
<div style="text-align:center;margin-top:8px"><button class="lnk" id="bw">So‘z ro‘yxatini nusxalash</button></div></div></details>`);
 $('#bf').onclick=saveFile;$('#bl').onclick=()=>$('#bfi').click();
 $('#bfi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>askRestore(r.result);r.readAsText(f)};
 $('#bt').onclick=()=>{const v=$('#bk').value.trim();v?askRestore(v):toast('Avval matnni joylang')};
 $('#bc').onclick=async()=>{if(await copyText(JSON.stringify(S))){stamp();toast('Zaxira nusxalandi')}};
 $('#bw').onclick=async()=>{if(await copyText(listText()))toast(W.length+' ta so‘z nusxalandi')}}

/* statistika va daraja: o‘zlashtirilgan lug‘at hajmi bo‘yicha (CEFR) */
function est(){let e=0;for(const w of W){if(known(w))e++;else if(w.d===0&&w.n)e+=.4*w.ok/((w.ok+w.bad)||1)}return e}
function rs(){const e=est();let li=0;for(let i=0;i<LV.length;i++)if(e>=LV[i][0])li=i;
 const lo=LV[li][0],nx=LV[li+1],p=nx?Math.min(100,(e-lo)/(nx[0]-lo)*100):100;
 let ok=0,bad=0,H=0,Kn=0,N=0;for(const w of W){ok+=w.ok;bad+=w.bad;if(w.d>0)H++;else if(w.s>=5)Kn++;if(!w.m)N++}
 const acc=ok+bad?Math.round(ok/(ok+bad)*100):0,t=S.log[day()]||{ok:0,bad:0};
 const ds=[];let mx=1;for(let i=6;i>=0;i--){const l=S.log[day(i)]||{ok:0,bad:0};ds.push([l,new Date(Date.now()-i*864e5).getDay()]);mx=Math.max(mx,l.ok+l.bad)}
 const bars=ds.map(([l,g])=>`<div class="bc"><div class="bb"><i style="height:${l.ok/mx*100}%"></i><i class="r" style="height:${l.bad/mx*100}%"></i></div><small>${DN[g]}</small></div>`).join('');
 const hd=W.filter(w=>w.d>0).sort((a,b)=>b.d-a.d||b.bad-a.bad).slice(0,5).map(w=>`<div class="hr"><b>${esc(w.en)}</b><span>${w.bad} marta xato</span></div>`).join('')||'<p class="hint" style="margin:0">Qiyin so‘z yo‘q</p>';
 const d=dAgo(),warn=W.length&&(d===null||d>7);
 $('#v-stats').innerHTML=`<header class="top"><h1>Statistika</h1></header>
${warn?`<div class="pan warn"><p>${d===null?'Hali zaxira nusxa olinmagan.':'Zaxira '+d+' kundan beri yangilanmagan.'} Ma’lumotni yo‘qotmaslik uchun saqlab qo‘ying.</p><button class="btn sm press" id="wb">Hozir saqlash</button></div>`:''}
<div class="lv"><div class="big">${LV[li][1]}</div><div style="flex:1"><p>Taxminiy lug‘at: <b>${Math.round(e)}</b> so‘z</p><div class="bar"><i style="width:${p}%"></i></div><p>${nx?`${nx[1]} gacha yana ${Math.max(1,Math.ceil(nx[0]-e))} so‘z`:'Eng yuqori daraja'}</p></div></div>
<div class="grid"><div class="tile"><b>${W.length}</b><small>Jami so‘z</small></div><div class="tile"><b style="color:var(--ok)">${Kn}</b><small>Yaxshi biladigan</small></div><div class="tile"><b style="color:var(--no)">${H}</b><small>Qiyin</small></div><div class="tile"><b style="color:var(--g1)">${N}</b><small>Yangi</small></div></div>
<div class="pan"><div class="acc"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle cx="40" cy="40" r="34" fill="none" stroke="#ecd49b" stroke-width="8" stroke-linecap="round" stroke-dasharray="${acc*2.136} 214" transform="rotate(-90 40 40)"/><text x="40" y="46" text-anchor="middle" fill="#f4efe6" font-size="20" font-weight="600">${acc}%</text></svg><div><b>Aniqlik</b><p class="hint" style="margin:4px 0 0">Bugun: ${t.ok} to‘g‘ri, ${t.bad} xato<br>Ketma-ket kun: ${streak()}</p></div></div></div>
<div class="pan"><h3>Oxirgi 7 kun</h3><div class="bars">${bars}</div></div>
<div class="pan"><h3>Eng qiyin so‘zlar</h3>${hd}</div>
<p class="hint">Daraja o‘zlashtirilgan so‘zlar soniga qarab hisoblanadi: A1 taxminan 500, A2 1000, B1 2000, B2 4000, C1 8000, C2 16000 so‘z.</p>
<div class="two"><button class="btn press" id="bkb">${ic('down')}Zaxira</button><button class="btn press" id="bst">${ic('set')}Sozlamalar</button></div>
<div class="two" style="margin-bottom:8px"><button class="btn press" data-act="guide">${ic('help')}Qo‘llanma</button></div>`;
 $('#bkb').onclick=backup;$('#bst').onclick=settings;const wb=$('#wb');if(wb)wb.onclick=backup}

/* tablar */
function sortUI(){document.querySelectorAll('#so button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.cfg.sort))}
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 $('#fab').classList.toggle('on',v==='words');
 if(v==='words')rw();if(v==='stats')rs();
 if(v==='home'){segs();tp();if(!cur||!W.includes(cur))next();else if(!busy&&!peek){$('#en').textContent=S.cfg.rev?cur.uz:cur.en}}}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};

/* ekran o‘chib qolmasligi */
let wl;async function wake(){try{if('wakeLock' in navigator&&!document.hidden&&(!wl||wl.released))wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{document.hidden?flush():wake()});
addEventListener('touchend',wake,{passive:true});
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ilova ikonasi: statik fayl, topilmasa canvas */
fetch('apple-touch-icon.png').then(r=>{if(!r.ok)throw 0}).catch(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);
 g.addColorStop(0,'#f3dda6');g.addColorStop(1,'#a77d36');x.fillStyle='#0a0a0c';x.fillRect(0,0,180,180);x.fillStyle=g;
 x.font='700 100px ui-serif,Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('Aa',90,96);$('#ati').href=c.toDataURL('image/png')});

/* offlayn: service worker, o‘rnatish, holat */
const VER='4.0';let dip=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const offReady=()=>!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
addEventListener('appinstalled',()=>{dip=null;toast('Ilova o‘rnatildi')});
addEventListener('offline',()=>toast('Internet yo‘q. Ilova offlayn ishlaydi'));
addEventListener('online',()=>toast('Internet qaytdi'));
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const n=r.installing;n&&n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)toast('Yangi versiya tayyor. Ilovani qayta oching')})})}).catch(()=>{}))}

applyCfg();sortUI();segs();tp();next();wake();save();
if(!hadLS)idb.get().then(j=>{if(!j)return;try{const o=JSON.parse(j);if(o&&Array.isArray(o.w)&&o.w.length&&!W.length){S=o;fixS();cur=null;applyCfg();sortUI();refresh();closeSheet();toast('Ma’lumot tiklandi')}}catch(e){}});
setTimeout(()=>{if(!S.seen&&!W.length)guide()},800);
if(cleaned){flush();setTimeout(()=>toast(cleaned+' ta buzilgan yozuv tozalandi'),600)}
</script>
</body>
</html>
